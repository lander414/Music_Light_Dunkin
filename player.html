<head>

  <style>

      margin: 0;
      padding: 0;
      user-select: none;

    }
    body {
      background-color: #0B1120;

      align-items: center;

      align-items: center;

      overflow: hidden;

      height: 30px;

      font-weight: 800;
      color: #F8FAFC;

      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-sub {

      color: #FDB913;
      font-weight: 600;
    }
    .time-badge {
      font-size: 11px;
      font-weight: 800;
      color: #38BDF8;
      background: #1E293B;
      padding: 3px 8px;
      border-radius: 6px;
      flex-shrink: 0;

    .controls-row {

      align-items: center;
      gap: 10px;

    .play-btn {
      background: #10B981;
      color: #042F2E;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }
    .play-btn.playing {
      background: #EF4444;
      color: #FFFFFF;
    }
    .restart-btn {
      background: #1E293B;
      color: #CBD5E1;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .slider-wrap {
      flex: 1;
      display: flex;
      align-items: center;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #FF671F;
      height: 6px;
      border-radius: 3px;
      background: #1E293B;
    }
  </style>
</head>

    try {
      const bin = atob(MUSIC_B64);
      musicBytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        musicBytes[i] = bin.charCodeAt(i);
      }
    } catch (e) {}

    function getReactiveFrame(sec) {
      if (!musicBytes || musicBytes.length < 3) {
        return { b: 0, bt: 0, r: 0 };
      }
      const totalFrames = Math.floor(musicBytes.length / 3);
      const slot = Math.max(0, Math.min(totalFrames - 1, Math.floor(sec * 10)));
      const idx = slot * 3;
      return {
        b: musicBytes[idx] || 0,
        bt: musicBytes[idx + 1] || 0,
        r: musicBytes[idx + 2] || 0
      };
    }

    function fmt(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    function sendToNative(payload) {
      try {
        if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
          window.ReactNativeWebView.postMessage(JSON.stringify(payload));
        }
      } catch (e) {}
    }

    function updateUi() {
      const cur = audio.currentTime || 0;
      const dur = (audio.duration && isFinite(audio.duration)) ? audio.duration : 2138;
      seekBar.max = Math.floor(dur);
      if (!isDragging) {
        seekBar.value = Math.floor(cur);
      }
      timeDisplay.textContent = fmt(cur) + ' / ' + fmt(dur);

      if (!audio.paused) {
        playPauseBtn.textContent = '⏸ PAUSE';
        playPauseBtn.classList.add('playing');
        const f = getReactiveFrame(cur);
        statusText.textContent = 'Playing • Bass:' + f.b + ' Beat:' + f.bt + ' RMS:' + f.r;
      } else {
        playPauseBtn.textContent = '▶ PLAY SONG';
        playPauseBtn.classList.remove('playing');
        statusText.textContent = 'Paused • Tap START LIGHT SHOW or PLAY';
      }
    }

    setInterval(() => {
      if (!audio.paused) {
        const cur = audio.currentTime || 0;
        const f = getReactiveFrame(cur);
        updateUi();
        sendToNative({
          type: 'MUSIC_STREAM',
          playing: true,
          b: f.b,
          bt: f.bt,
          r: f.r,
          currentTimeMs: Math.floor(cur * 1000)

    audio.addEventListener('timeupdate', () => {
      updateUi();
    });
    audio.addEventListener('play', () => {
      updateUi();
      sendToNative({
        type: 'AUDIO_STATE',
        playing: true,
        currentTimeMs: Math.floor((audio.currentTime || 0) * 1000)
      });
    });
    audio.addEventListener('pause', () => {
      updateUi();
      sendToNative({
        type: 'AUDIO_STATE',
        playing: false,
        currentTimeMs: Math.floor((audio.currentTime || 0) * 1000)
      });
    });

    function toggleAudioFromUi() {
      if (audio.paused) {
        audio.play().then(() => {
          sendToNative({
            type: 'UI_TOGGLE_PLAY',
            playing: true,
            currentTimeMs: Math.floor((audio.currentTime || 0) * 1000)
          });
        }).catch((err) => {
          statusText.textContent = 'Audio error: ' + err.message;
        });
      } else {
        audio.pause();
        sendToNative({
          type: 'UI_TOGGLE_PLAY',
          playing: false,
          currentTimeMs: Math.floor((audio.currentTime || 0) * 1000)
        });
      }
    }

    function restartAudioFromUi() {
      audio.currentTime = 0;
      updateUi();
      sendToNative({
        type: 'AUDIO_SEEK',
        playing: !audio.paused,
        currentTimeMs: 0
      });
    }

    function onSliderInput(val) {
      isDragging = true;
      const dur = (audio.duration && isFinite(audio.duration)) ? audio.duration : 2138;
      timeDisplay.textContent = fmt(Number(val)) + ' / ' + fmt(dur);
    }

    function onSliderChange(val) {
      isDragging = false;
      audio.currentTime = Number(val);
      updateUi();
      sendToNative({
        type: 'AUDIO_SEEK',
        playing: !audio.paused,
        currentTimeMs: Math.floor(Number(val) * 1000)
      });
    }

    window.startShowMusic = function(resetToZero) {
      if (resetToZero) {
        audio.currentTime = 0;
      }
      audio.play().catch(() => {});
      updateUi();
    };

    window.stopShowMusic = function() {
      audio.pause();
      updateUi();
    };

    window.detectPhoneHotspotSubnets = function() {
      try {
        const RTCPeer = window.RTCPeerConnection || window.webkitRTCPeerConnection;
        if (!RTCPeer) return;
        const pc = new RTCPeer({ iceServers: [] });
        pc.createDataChannel('dunkin');
        pc.onicecandidate = function(e) {
          if (!e || !e.candidate || !e.candidate.candidate) return;
          const matches = e.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/g);
          if (!matches) return;
          for (let i = 0; i < matches.length; i++) {
            const ip = matches[i];
            if (ip.startsWith('127.') || ip === '0.0.0.0') continue;
            const parts = ip.split('.');
            if (parts.length === 4) {
              const subnet = parts[0] + '.' + parts[1] + '.' + parts[2];
              sendToNative({
                type: 'LOCAL_SUBNET',
                ip: ip,
                subnet: subnet
              });
            }
          }
        };
        pc.createOffer().then(function(offer) {
          return pc.setLocalDescription(offer);
        }).catch(function() {});
        setTimeout(function() {
          try { pc.close(); } catch (err) {}
        }, 3000);
      } catch (err) {}
    };

    setTimeout(window.detectPhoneHotspotSubnets, 400);
  </script>
</body>
</html>
