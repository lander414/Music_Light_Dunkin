<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0B1120;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 10px 12px;
      overflow: hidden;
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .song-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }
    .music-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #FF671F, #FDB913);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }
    .song-text {
      overflow: hidden;
    }
    .song-title {
      font-size: 12px;
      font-weight: 800;
      color: #F8FAFC;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-sub {
      font-size: 10px;
      color: #FDB913;
      font-weight: 600;
    }
    .time-badge {
      font-size: 11px;
      font-weight: 800;
      color: #38BDF8;
      background: #1E293B;
      padding: 3px 8px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .play-btn {
      background: #10B981;
      color: #042F2E;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }
    .play-btn.playing {
      background: #EF4444;
      color: #FFFFFF;
    }
    .restart-btn {
      background: #1E293B;
      color: #CBD5E1;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .slider-wrap {
      flex: 1;
      display: flex;
      align-items: center;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #FF671F;
      height: 6px;
      border-radius: 3px;
      background: #1E293B;
    }
  </style>
</head>
<body>
  <div class="top-row">
    <div class="song-info">
      <div class="music-icon">🎵</div>
      <div class="song-text">
        <div class="song-title">2026 Christmas Lighting Songs.mp3</div>
        <div class="song-sub" id="statusText">Ready • Synced to MusicLightSync (180ms step)</div>
      </div>
    </div>
    <div class="time-badge" id="timeDisplay">00:00 / 35:38</div>
  </div>

  <div class="controls-row">
    <button class="play-btn" id="playPauseBtn" onclick="toggleAudioFromUi()">▶ PLAY SONG</button>
    <button class="restart-btn" onclick="restartAudioFromUi()">⏮ 0:00</button>
    <div class="slider-wrap">
      <input type="range" id="seekBar" min="0" max="2138" value="0" step="1" oninput="onSliderInput(this.value)" onchange="onSliderChange(this.value)" />
    </div>
  </div>

  <audio id="bgm" src="file:///android_asset/christmas_lighting_2026.mp3" preload="auto" loop></audio>

  <script>
    const audio = document.getElementById('bgm');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const statusText = document.getElementById('statusText');
    const timeDisplay = document.getElementById('timeDisplay');
    const seekBar = document.getElementById('seekBar');
    let isDragging = false;

    function fmt(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    function sendToNative(payload) {
      try {
        if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
          window.ReactNativeWebView.postMessage(JSON.stringify(payload));
        }
      } catch (e) {}
    }

    function updateUi() {
      const cur = audio.currentTime || 0;
      const dur = (audio.duration && isFinite(audio.duration)) ? audio.duration : 2138;
      seekBar.max = Math.floor(dur);
      if (!isDragging) {
        seekBar.value = Math.floor(cur);
      }
      timeDisplay.textContent = fmt(cur) + ' / ' + fmt(dur);

      if (!audio.paused) {
        playPauseBtn.textContent = '⏸ PAUSE';
        playPauseBtn.classList.add('playing');
        const stepNum = Math.floor((cur * 1000) / 180);
        statusText.textContent = 'Playing Audio • Beat Step #' + stepNum;
      } else {
        playPauseBtn.textContent = '▶ PLAY SONG';
        playPauseBtn.classList.remove('playing');
        statusText.textContent = 'Paused • Tap START ALL or PLAY SONG';
      }
    }

    audio.addEventListener('loadedmetadata', updateUi);
    audio.addEventListener('timeupdate', () => {
      updateUi();
      sendToNative({
        type: 'AUDIO_TIME',
        playing: !audio.paused,
        currentTimeMs: Math.floor((audio.currentTime || 0) * 1000)
      });
    });
    audio.addEventListener('play', () => {
      updateUi();
      sendToNative({
        type: 'AUDIO_STATE',
        playing: true,
        currentTimeMs: Math.floor((audio.currentTime || 0) * 1000)
      });
    });
    audio.addEventListener('pause', () => {
      updateUi();
      sendToNative({
        type: 'AUDIO_STATE',
        playing: false,
        currentTimeMs: Math.floor((audio.currentTime || 0) * 1000)
      });
    });

    function toggleAudioFromUi() {
      if (audio.paused) {
        audio.play().then(() => {
          sendToNative({
            type: 'UI_TOGGLE_PLAY',
            playing: true,
            currentTimeMs: Math.floor((audio.currentTime || 0) * 1000)
          });
        }).catch((err) => {
          statusText.textContent = 'Audio error: ' + err.message;
        });
      } else {
        audio.pause();
        sendToNative({
          type: 'UI_TOGGLE_PLAY',
          playing: false,
          currentTimeMs: Math.floor((audio.currentTime || 0) * 1000)
        });
      }
    }

    function restartAudioFromUi() {
      audio.currentTime = 0;
      updateUi();
      sendToNative({
        type: 'AUDIO_SEEK',
        playing: !audio.paused,
        currentTimeMs: 0
      });
    }

    function onSliderInput(val) {
      isDragging = true;
      const dur = (audio.duration && isFinite(audio.duration)) ? audio.duration : 2138;
      timeDisplay.textContent = fmt(Number(val)) + ' / ' + fmt(dur);
    }

    function onSliderChange(val) {
      isDragging = false;
      audio.currentTime = Number(val);
      updateUi();
      sendToNative({
        type: 'AUDIO_SEEK',
        playing: !audio.paused,
        currentTimeMs: Math.floor(Number(val) * 1000)
      });
    }

    // Called from React Native Master Controller
    window.startShowMusic = function(resetToZero) {
      if (resetToZero) {
        audio.currentTime = 0;
      }
      audio.play().catch(() => {});
      updateUi();
    };

    window.stopShowMusic = function() {
      audio.pause();
      updateUi();
    };
  </script>
</body>
</html>
